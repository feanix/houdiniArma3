[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a3ob-houdini"
version = "0.2.0"
description = "Houdini port of Arma 3 Object Builder: P3D and related Arma 3 formats in Houdini"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "houdiniArma3 contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Upstream = "https://github.com/MrClock8163/Arma3ObjectBuilder"

[tool.setuptools.packages.find]
where = ["python"]
